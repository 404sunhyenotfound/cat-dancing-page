<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 고양이 몸통 -->
  <ellipse cx="100" cy="130" rx="45" ry="55" fill="#FF9E5A" stroke="#FF7F2A" stroke-width="2"/>

  <!-- 고양이 머리 -->
  <circle cx="100" cy="70" r="40" fill="#FF9E5A" stroke="#FF7F2A" stroke-width="2"/>

  <!-- 왼쪽 귀 -->
  <path d="M 70 50 L 60 20 L 85 45 Z" fill="#FF9E5A" stroke="#FF7F2A" stroke-width="2"/>
  <path d="M 70 48 L 65 30 L 82 46 Z" fill="#FFB380"/>

  <!-- 오른쪽 귀 -->
  <path d="M 130 50 L 140 20 L 115 45 Z" fill="#FF9E5A" stroke="#FF7F2A" stroke-width="2"/>
  <path d="M 130 48 L 135 30 L 118 46 Z" fill="#FFB380"/>

  <!-- 왼쪽 눈 -->
  <ellipse cx="85" cy="65" rx="8" ry="12" fill="#2C3E50"/>
  <circle cx="85" cy="62" r="3" fill="white"/>

  <!-- 오른쪽 눈 -->
  <ellipse cx="115" cy="65" rx="8" ry="12" fill="#2C3E50"/>
  <circle cx="115" cy="62" r="3" fill="white"/>

  <!-- 코 -->
  <path d="M 100 75 L 95 82 L 105 82 Z" fill="#FF6B9D"/>

  <!-- 입 -->
  <path d="M 100 82 Q 90 88 85 85" fill="none" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100 82 Q 110 88 115 85" fill="none" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>

  <!-- 수염 왼쪽 -->
  <line x1="60" y1="68" x2="35" y2="65" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="60" y1="73" x2="35" y2="73" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="60" y1="78" x2="35" y2="81" stroke="#2C3E50" stroke-width="1.5"/>

  <!-- 수염 오른쪽 -->
  <line x1="140" y1="68" x2="165" y2="65" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="140" y1="73" x2="165" y2="73" stroke="#2C3E50" stroke-width="1.5"/>
  <line x1="140" y1="78" x2="165" y2="81" stroke="#2C3E50" stroke-width="1.5"/>

  <!-- 왼쪽 팔 -->
  <ellipse cx="65" cy="120" rx="15" ry="35" fill="#FF9E5A" stroke="#FF7F2A" stroke-width="2"/>

  <!-- 오른쪽 팔 -->
  <ellipse cx="135" cy="120" rx="15" ry="35" fill="#FF9E5A" stroke="#FF7F2A" stroke-width="2"/>

  <!-- 왼쪽 발 -->
  <ellipse cx="80" cy="175" rx="18" ry="12" fill="#FF9E5A" stroke="#FF7F2A" stroke-width="2"/>

  <!-- 오른쪽 발 -->
  <ellipse cx="120" cy="175" rx="18" ry="12" fill="#FF9E5A" stroke="#FF7F2A" stroke-width="2"/>

  <!-- 꼬리 -->
  <path d="M 135 150 Q 160 140 165 110 Q 168 85 155 75" fill="none" stroke="#FF7F2A" stroke-width="12" stroke-linecap="round"/>

  <!-- 배 -->
  <ellipse cx="100" cy="135" rx="30" ry="35" fill="#FFD4A8" opacity="0.7"/>
</svg>
